<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Weather Pro — Real-Time Weather Forecast</title>
  <meta name="description" content="Get real-time weather forecasts, hourly predictions, 5-day outlook, air quality index, UV levels, and live radar maps for any city worldwide." />
  <meta name="theme-color" content="#0a1628" />

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Lucide Icons (lightweight SVG icons) -->
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>

  <!-- Leaflet.js -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- App Styles -->
  <link rel="stylesheet" href="style.css"/>
</head>
<body>

  <!-- ════════════════════════════════════════════════ -->
  <!--  WEATHER ALERT BANNER (hidden by default)      -->
  <!-- ════════════════════════════════════════════════ -->
  <div class="alert-banner" id="alertBanner" style="display:none;">
    <div class="alert-banner__content">
      <i data-lucide="alert-triangle"></i>
      <span id="alertBannerText"></span>
      <button class="alert-banner__close" id="alertBannerClose" aria-label="Dismiss alert">&times;</button>
    </div>
  </div>

  <!-- ════════════════════════════════════════════════ -->
  <!--  NAVIGATION BAR                                 -->
  <!-- ════════════════════════════════════════════════ -->
  <nav class="navbar">
    <a href="#" class="navbar__brand">
      <span class="navbar__logo">⛅</span>
      <span class="navbar__title">Weather<span class="accent">Pro</span></span>
    </a>

    <div class="navbar__controls">
      <!-- Search -->
      <div class="search-group">
        <div class="search-input-wrapper">
          <i data-lucide="search" class="search-icon"></i>
          <input type="text" id="cityInput" placeholder="Search city..." autocomplete="off" aria-label="Search city" />
        </div>
        <button id="searchBtn" class="btn btn--primary" aria-label="Search weather">
          Search
        </button>
        <button id="geoBtn" class="btn btn--ghost" title="Use my location" aria-label="Get weather for my location">
          <i data-lucide="map-pin"></i>
        </button>
      </div>

      <!-- Unit Toggle -->
      <div class="unit-toggle">
        <span class="unit-toggle__label" id="unitLabel">°C</span>
        <label class="toggle-switch" aria-label="Toggle temperature unit">
          <input type="checkbox" id="unitToggle" />
          <span class="toggle-switch__slider"></span>
        </label>
        <span class="unit-toggle__label">°F</span>
      </div>

      <!-- Theme Toggle -->
      <button id="themeToggle" class="btn btn--icon" title="Toggle theme" aria-label="Toggle dark/light theme">
        <i data-lucide="moon" id="themeIcon"></i>
      </button>
    </div>
  </nav>

  <!-- ════════════════════════════════════════════════ -->
  <!--  DATE & TIME BAR                                -->
  <!-- ════════════════════════════════════════════════ -->
  <div class="datetime-bar" id="dateTime"></div>

  <!-- ════════════════════════════════════════════════ -->
  <!--  MAIN CONTENT                                   -->
  <!-- ════════════════════════════════════════════════ -->
  <main class="content">

    <!-- ── Welcome / Prompt ── -->
    <div class="welcome-prompt" id="welcomePrompt">
      <div class="welcome-prompt__icon">🌍</div>
      <h2>Explore Weather Worldwide</h2>
      <p>Search for a city or use your location to get started</p>
    </div>

    <!-- ── Weather Dashboard (hidden until search) ── -->
    <div class="dashboard" id="dashboard" style="display:none;">

      <!-- Row 1: Current Weather + Details Grid -->
      <section class="card card--hero" id="currentWeatherCard">
        <div class="card__header">
          <h2><i data-lucide="cloud-sun"></i> Current Weather</h2>
        </div>
        <div class="hero-weather" id="heroWeather">
          <!-- Populated by JS -->
        </div>
      </section>

      <!-- Row 2: Detail Cards -->
      <div class="detail-grid" id="detailGrid">
        <!-- Populated by JS: Wind, Humidity, Pressure, Visibility, Sunrise/Sunset, etc. -->
      </div>

      <!-- Row 3: AQI + UV Index -->
      <div class="env-row">
        <section class="card card--aqi" id="aqiCard">
          <div class="card__header">
            <h2><i data-lucide="wind"></i> Air Quality</h2>
          </div>
          <div class="aqi-content" id="aqiContent">
            <div class="skeleton skeleton--aqi"></div>
          </div>
        </section>

        <section class="card card--uv" id="uvCard">
          <div class="card__header">
            <h2><i data-lucide="sun"></i> UV Index</h2>
          </div>
          <div class="uv-content" id="uvContent">
            <div class="skeleton skeleton--uv"></div>
          </div>
        </section>
      </div>

      <!-- Row 4: Hourly Forecast -->
      <section class="card card--forecast" id="hourlyCard">
        <div class="card__header">
          <h2><i data-lucide="clock"></i> Hourly Forecast</h2>
        </div>
        <div class="hourly-scroll" id="hourlyContainer">
          <!-- Populated by JS -->
        </div>
      </section>

      <!-- Row 5: 5-Day Forecast -->
      <section class="card card--forecast" id="weeklyCard">
        <div class="card__header">
          <h2><i data-lucide="calendar-days"></i> 5-Day Forecast</h2>
        </div>
        <div class="weekly-list" id="weeklyContainer">
          <!-- Populated by JS -->
        </div>
      </section>

      <!-- Row 6: Radar Map -->
      <section class="card card--map" id="mapCard">
        <div class="card__header">
          <h2><i data-lucide="radar"></i> Live Radar</h2>
          <div class="map-layer-controls" id="mapLayerControls">
            <button class="layer-btn active" data-layer="precipitation_new">Rain</button>
            <button class="layer-btn" data-layer="temp_new">Temp</button>
            <button class="layer-btn" data-layer="clouds_new">Clouds</button>
            <button class="layer-btn" data-layer="wind_new">Wind</button>
          </div>
        </div>
        <div id="map"></div>
      </section>

    </div><!-- /dashboard -->
  </main>

  <!-- ════════════════════════════════════════════════ -->
  <!--  TOAST CONTAINER                                -->
  <!-- ════════════════════════════════════════════════ -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- ════════════════════════════════════════════════ -->
  <!--  FOOTER                                         -->
  <!-- ════════════════════════════════════════════════ -->
  <footer class="footer">
    <p>Crafted with ❤️ by <a href="https://github.com/debrajx1" target="_blank" rel="noopener">Debraj Naik</a></p>
    <p class="footer__version">v2.0 — Powered by OpenWeatherMap & Leaflet</p>
  </footer>

  <!-- App Script -->
  <script src="script.js"></script>
</body>
</html>
